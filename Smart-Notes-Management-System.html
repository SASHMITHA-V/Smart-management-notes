<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Notes Management System</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
display:flex;
background:#f5f7ff;
min-height:100vh;
}

.sidebar{
width:260px;
background:#08152f;
color:white;
padding:20px;
}

.logo{
font-size:26px;
font-weight:bold;
margin-bottom:30px;
}

.sidebar ul{
list-style:none;
}

.sidebar li{
padding:15px;
margin:10px 0;
background:rgba(255,255,255,0.08);
border-radius:10px;
cursor:pointer;
}

.main{
flex:1;
padding:20px;
}

.hero{
background:linear-gradient(135deg,#6c63ff,#4ea8ff);
color:white;
padding:25px;
border-radius:15px;
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.hero img{
width:250px;
border-radius:10px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.form{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

input,select,textarea{
width:100%;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
}

button{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
background:#6c63ff;
color:white;
margin-top:5px;
}

.notes{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:15px;
}

.note{
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.high{border-left:6px solid red;}
.medium{border-left:6px solid orange;}
.low{border-left:6px solid green;}

.dark{
background:#121212;
color:white;
}

.dark .card,
.dark .form,
.dark .note{
background:#1f1f1f;
color:white;
}

.dark input,
.dark textarea,
.dark select{
background:#333;
color:white;
border:1px solid #555;
}
</style>
</head>
<body>

<div class="sidebar">
<div class="logo">📝 Smart Notes</div>

<ul>
<li>🏠 Dashboard</li>
<li>📒 All Notes</li>
<li>📌 Pinned</li>
<li>📚 Categories</li>
<li>⭐ Important</li>
<li>⏰ Reminders</li>
<li onclick="toggleDark()">🌙 Dark Mode</li>
</ul>
</div>

<div class="main">

<div class="hero">
<div>
<h1>Capture Ideas ✨</h1>
<p>Your thoughts, perfectly organized.</p>
</div>

<img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=800"
alt="Digital Workspace">
</div>

<div class="cards">

<div class="card">
<h3>📘 Total Notes</h3>
<h2 id="totalNotes">0</h2>
</div>

<div class="card">
<h3>📌 Pinned</h3>
<h2 id="pinnedNotes">0</h2>
</div>

<div class="card">
<h3>⭐ High Priority</h3>
<h2 id="highNotes">0</h2>
</div>

<div class="card">
<h3>📂 Categories</h3>
<h2>4</h2>
</div>

</div>

<div class="form">

<input type="text" id="search" placeholder="🔍 Search Notes">

<textarea id="noteText" rows="4"
placeholder="Write your note..."></textarea>

<select id="category">
<option>📚 Study</option>
<option>💼 Work</option>
<option>🏠 Personal</option>
<option>💡 Ideas</option>
</select>

<select id="priority">
<option value="high">🔴 High</option>
<option value="medium">🟡 Medium</option>
<option value="low">🟢 Low</option>
</select>

<label>
<input type="checkbox" id="pin">
📌 Pin Note
</label>

<br>

<button onclick="addNote()">➕ Add Note</button>

</div>

<div class="notes" id="notesContainer"></div>

</div>

<script>

let notes =
JSON.parse(localStorage.getItem("notes")) || [];

renderNotes();

function addNote(){

const text =
document.getElementById("noteText").value;

if(text.trim()==""){
alert("Enter note");
return;
}

const note={
text:text,
category:document.getElementById("category").value,
priority:document.getElementById("priority").value,
pinned:document.getElementById("pin").checked,
date:new Date().toLocaleString()
};

notes.push(note);

saveNotes();

document.getElementById("noteText").value="";

renderNotes();
}

function renderNotes(){

const container=
document.getElementById("notesContainer");

container.innerHTML="";

let pinnedCount=0;
let highCount=0;

notes.sort((a,b)=>b.pinned-a.pinned);

notes.forEach((note,index)=>{

if(note.pinned) pinnedCount++;
if(note.priority==="high") highCount++;

container.innerHTML += `
<div class="note ${note.priority}">
<h3>${note.category}</h3>
<p>${note.text}</p>
<p>📅 ${note.date}</p>
<p>${note.pinned ? '📌 Pinned' : ''}</p>

<button onclick="deleteNote(${index})">
🗑 Delete
</button>
</div>
`;
});

document.getElementById("totalNotes").innerText=
notes.length;

document.getElementById("pinnedNotes").innerText=
pinnedCount;

document.getElementById("highNotes").innerText=
highCount;
}

function deleteNote(index){

notes.splice(index,1);

saveNotes();

renderNotes();
}

function saveNotes(){

localStorage.setItem(
"notes",
JSON.stringify(notes)
);
}

document.getElementById("search")
.addEventListener("keyup",function(){

let value=this.value.toLowerCase();

let cards=document.querySelectorAll(".note");

cards.forEach(card=>{

card.style.display=
card.innerText.toLowerCase()
.includes(value)
? "block" : "none";
});
});

function toggleDark(){
document.body.classList.toggle("dark");
}

</script>

</body>
</html>
